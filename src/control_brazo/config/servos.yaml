# ─────────────────────────────────────────────────────────────
#  Configuracion de servos del brazo 5-DOF
#  Cada nodo driver lee solo los servos de su tipo (AX12A / EX106)
#
#  Nota: ROS 2 no soporta listas de diccionarios como parametros,
#  por eso los servos van como mapas anidados (servos.<nombre>.<campo>)
#  y servo_names define el conjunto.
# ─────────────────────────────────────────────────────────────

ax12a_driver:
  ros__parameters:
    # Ruta estable por-id del U2D2 (FTDI): no depende del orden de conexion.
    # Si cambias de adaptador, actualiza con: ls /dev/serial/by-id/
    port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTAKRLUN-if00-port0"
    baudrate: 1000000
    loop_rate_hz: 66           # ~15ms por ciclo
    servo_names: ["Base", "Codo", "Munieca_P", "Munieca_Y", "Munieca_R"]
    # ── PATAS (modo rueda, giro continuo) — mismo bus AX-12A que el brazo ──
    # IDs y reduccion PROVISIONALES: actualizar con los reales.
    # velocidad fija de giro (0-100%); el stick solo decide direccion on/off.
    wheel_speed_pct: 40.0
    wheel_cmd_timeout_s: 0.4   # si no llegan comandos, las patas se detienen
    wheel_names: ["PataDelIzq", "PataDelDer", "PataTrasIzq", "PataTrasDer"]
    wheels:
      PataDelIzq:                 # delantera izquierda
        id: 40                    # ID PROVISIONAL
        reduccion: 4.0            # reduccion PROVISIONAL (x)
        invertir_giro: false
      PataDelDer:                 # delantera derecha (lado opuesto → invertida)
        id: 41                    # ID PROVISIONAL
        reduccion: 4.0
        invertir_giro: true
      PataTrasIzq:                # trasera izquierda
        id: 42                    # ID PROVISIONAL
        reduccion: 4.0
        invertir_giro: false
      PataTrasDer:                # trasera derecha (lado opuesto → invertida)
        id: 43                    # ID PROVISIONAL
        reduccion: 4.0
        invertir_giro: true
    servos:
      Base:
        id: 16
        reduccion: 27.0
        deadband_deg: 0.5
        invertir_giro: false
      Codo:
        id: 18
        reduccion: 27.0
        deadband_deg: 0.5
        invertir_giro: false
      Munieca_P:
        id: 30
        reduccion: 27.0
        deadband_deg: 0.5
        invertir_giro: true
      Munieca_Y:
        id: 4
        reduccion: 16.0
        deadband_deg: 0.5
        invertir_giro: false
      Munieca_R:
        id: 6
        reduccion: 16.0
        deadband_deg: 0.5
        invertir_giro: false

ex106_driver:
  ros__parameters:
    # Ruta estable por-id del adaptador RS485 (CH340): no depende del orden.
    # Si cambias de adaptador, actualiza con: ls /dev/serial/by-id/
    port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
    baudrate: 57600
    loop_rate_hz: 66
    servo_names: ["Hombro"]
    servos:
      Hombro:
        id: 1
        reduccion: 25.0
        deadband_deg: 0.5
        invertir_giro: false

cinematica:
  ros__parameters:
    base_height:  0.14
    L1:           0.22
    L2:           0.20
    L3:           0.12
    tool_length:  0.10
    # Orden de joints para armar q[] (debe coincidir con los nombres publicados)
    joint_order:
      - "Base"
      - "Hombro"
      - "Codo"
      - "Munieca_P"
      - "Munieca_Y"
      - "Munieca_R"
    # Joints que se dibujan con el giro invertido en la simulacion (el modelo
    # gira al reves que el servo real). Solo afecta la visualizacion/pose.
    sim_invert_joints:
      - "Munieca_P"

simulacion:
  ros__parameters:
    # Alcance maximo del brazo en metros, usado para escalar los ejes.
    # = base_height + L1 + L2 + L3 + tool_length
    reach: 0.74

gui_control:
  ros__parameters:
    # Alcance para escalar la visualizacion 3D embebida
    reach: 0.74
    # Orden de joints en el vector q[] — debe coincidir con cinematica/joint_order
    joint_order:
      - "Base"
      - "Hombro"
      - "Codo"
      - "Munieca_P"
      - "Munieca_Y"
      - "Munieca_R"
    # Mapeo joint → driver ("ax" | "ex") + ID de servo
    joint_drivers:
      Base:
        driver: "ax"
        id: 16
      Hombro:
        driver: "ex"
        id: 1
      Codo:
        driver: "ax"
        id: 18
      Munieca_P:
        driver: "ax"
        id: 30
      Munieca_Y:
        driver: "ax"
        id: 4
      Munieca_R:
        driver: "ax"
        id: 5            # ID PROVISIONAL - actualizar con el ID real del servo
